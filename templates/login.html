{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Login</h2>
            <div class="animation-container">
                <div class="shield-animation">
                    <div class="shield"></div>
                    <div class="check"></div>
                </div>
            </div>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-auth">Login</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Animation for the login page
document.addEventListener('DOMContentLoaded', function() {
    const shield = document.querySelector('.shield');
    const check = document.querySelector('.check');
    
    setTimeout(() => {
        shield.style.transform = 'scale(1) rotate(0deg)';
        shield.style.opacity = '1';
    }, 100);
    
    setTimeout(() => {
        check.style.transform = 'scale(1)';
        check.style.opacity = '1';
    }, 600);
    
    // Reload animation when page is refreshed
    window.addEventListener('beforeunload', function() {
        shield.style.transform = 'scale(0.5) rotate(-30deg)';
        shield.style.opacity = '0';
        check.style.transform = 'scale(0)';
        check.style.opacity = '0';
    });
});
</script>
{% endblock %}
